<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Half Adder</title>

    <!-- css -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #222;
        color: #fff;
        font-family: "Asap Sharp", sans-serif;
      }

      h1 {
        margin: 12px 0;
      }

      main {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      svg {
        padding: 4px;
        border: 1px solid white;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Half Adder</h1>

      <svg width="800" height="400" viewbox="0 0 400 200">
        <!-- inputs -->
        <g>
          <circle
            cx="8"
            cy="67"
            r="6"
            fill="red"
            stroke="black"
            stroke-width="2"
          />
          <text x="4" y="84" font-size="11" fill="white">Input A</text>
        </g>
        <g>
          <circle
            cx="8"
            cy="127"
            r="6"
            fill="white"
            stroke="black"
            stroke-width="2"
          />
          <text x="4" y="143" font-size="11" fill="white">Input B</text>
        </g>

        <!-- outputs -->
        <g>
          <circle
            cx="393"
            cy="67"
            r="6"
            fill="red"
            stroke="black"
            stroke-width="2"
          />
          <text x="375" y="84" font-size="11" fill="white">Sum</text>
        </g>
        <g>
          <circle
            cx="393"
            cy="127"
            r="6"
            fill="white"
            stroke="black"
            stroke-width="2"
          />
          <text x="370" y="143" font-size="11" fill="white">Carry</text>
        </g>

        <!-- gates -->
        <g>
          <rect
            x="160"
            y="50"
            width="80"
            height="40"
            fill="lightpink"
            stroke="black"
            stroke-width="2"
          />
          <text x="180" y="77" font-size="20" fill="black" font-weight="bold">
            XOR
          </text>
        </g>
        <g>
          <rect
            x="160"
            y="120"
            width="80"
            height="40"
            fill="lightblue"
            stroke="black"
            stroke-width="2"
          />
          <text x="180" y="147" font-size="20" fill="black" font-weight="bold">
            AND
          </text>
        </g>

        <!-- input wires -->
        <g>
          <polyline
            points="12,67 159,67"
            fill="none"
            stroke="red"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <polyline
            points="80,67 80,150 159, 150"
            fill="none"
            stroke="red"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>
        <g>
          <polyline
            points="12,127 159,127"
            fill="none"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <polyline
            points="100,127 100,82 159,82"
            fill="none"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>

        <!-- output wires -->
        <polyline
          points="241,67 389,67"
          fill="none"
          stroke="red"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <polyline
          points="241,127 389,127"
          fill="none"
          stroke="white"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </main>
  </body>
</html>
