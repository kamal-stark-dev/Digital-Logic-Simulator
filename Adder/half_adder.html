<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Half Adder</title>

    <!-- css -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #222;
        color: #fff;
        font-family: "Asap Sharp", sans-serif;
      }

      h1 {
        margin: 12px 0;
      }

      main {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Half Adder</h1>

      <svg
        class="logic-diagram"
        viewBox="0 0 800 500"
        width="800px"
        xmlns="http://www.w3.org/2000/svg"
      >
        <style>
          .board {
            fill: #222;
            stroke: white;
            stroke-width: 2;
            font-family: "Asap Sharp", sans-serif;
          }

          .wire {
            fill: none;
            stroke: white;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
          }

          .wire .active {
            stroke: #e4572e;
          }

          .node {
            fill: #ccc;
            stroke: #fff;
            stroke-width: 2;
          }

          .node circle.active {
            fill: #e4572e;
          }

          .label-bg {
            fill: #333;
          }

          .label-text {
            fill: white;
            font-family: Arial, sans-serif;
            font-weight: 600;
            font-size: 12px;

            text-anchor: middle;
            dominant-baseline: middle;
          }

          .xor-gate {
            fill: #9a48d0;
          }

          .and-gate {
            fill: #d90368;
          }

          .gate-symbol {
            fill: #fff;
            font-size: 20px;
            font-weight: bolder;
            text-anchor: middle;
            dominant-baseline: middle;
          }
        </style>

        <!-- Diagram background -->
        <rect class="board" x="1" y="1" width="798" height="498" />

        <!-- Vertical borders -->
        <path d="M41 2V498 M759 2V498" stroke="white" fill="none" />

        <!-- Left labels -->
        <g class="label">
          <rect class="label-bg" x="11" y="160" width="60" height="20" rx="2" />
          <text class="label-text" x="41" y="170">INPUT A</text>

          <rect class="label-bg" x="11" y="370" width="60" height="20" rx="2" />
          <text class="label-text" x="41" y="380">INPUT B</text>
        </g>

        <!-- Right labels -->
        <g class="label">
          <rect
            class="label-bg"
            x="729"
            y="160"
            width="60"
            height="20"
            rx="2"
          />
          <text class="label-text" x="759" y="170">SUM</text>

          <rect
            class="label-bg"
            x="729"
            y="370"
            width="60"
            height="20"
            rx="2"
          />
          <text class="label-text" x="759" y="380">CARRY</text>
        </g>

        <!-- Connection wires -->
        <g class="wire">
          <!-- Input A to XOR and AND -->
          <g id="input-wire-a">
            <path d="M52 146 H202 V126 H362" />
            <path d="M202 146 V338 H356" />
          </g>

          <!-- Input B to XOR and AND -->
          <g id="input-wire-b">
            <path d="M52 356 H140 V164 H362" />
            <path d="M140 356 V374 H356" />
          </g>

          <!-- XOR output to SUM -->
          <path id="output-wire-sum" d="M433 145 H750" />

          <!-- AND output to CARRY -->
          <path id="output-wire-carry" d="M437 355 H750" />
        </g>

        <!-- Connection points -->
        <g class="node">
          <circle id="input-node-a" cx="41" cy="146" r="9.5" />
          <circle id="input-node-b" cx="41" cy="356" r="9.5" />
          <circle id="output-node-sum" cx="759" cy="146" r="9.5" />
          <circle id="output-node-carry" cx="759" cy="356" r="9.5" />
        </g>

        <!-- XOR gate -->
        <g class="xor-gate">
          {/* Main XOR gate body */}
          <path
            d="
              M350 107
              C390 107 420 126 433.254 145.54
              C420 165 390 184 350 184
              C359 175 365 161 365 145.54
              C365 130 359 116 350 107
              Z
            "
          />

          {/* White stroke around the complete outer boundary */}
          <path
            d="
              M350 107
              C390 107 420 126 433.254 145.54
              C420 165 390 184 350 184
              C359 175 365 161 365 145.54
              C365 130 359 116 350 107
              Z
            "
            stroke="white"
            stroke-width="3"
            stroke-linejoin="round"
            fill="none"
          />

          {/* XOR curve */}
          <path
            d="M336.051 114.027C355.696 114.027 363.882 170.917 336.051 177.875"
            stroke="#fff"
            stroke-width="4"
            stroke-linecap="round"
            fill="none"
          />

          {/* XOR label */}
          <text class="gate-symbol" x="395" y="147">XOR</text>
        </g>

        <!-- AND gate -->
        <g class="and-gate">
          <path
            d="M 356.404 318.25
          H 400.738
          A 36.946 36.946 0 0 1 437.684 355.196
          A 36.946 36.946 0 0 1 400.738 392.142
          H 356.404 Z"
            stroke="white"
            stroke-width="3"
          />

          {/* AND label */}
          <text class="gate-symbol" x="400" y="357">AND &nbsp;</text>
        </g>
      </svg>
    </main>

    <!-- javascript -->
    <script>
      input_node_a = document.getElementById("input-node-a");
      input_node_b = document.getElementById("input-node-b");

      input_wire_a = document.getElementById("input-wire-a");
      input_wire_b = document.getElementById("input-wire-b");

      input_a = 0;
      input_b = 0;

      input_node_a.addEventListener("click", () => {
        input_a = !input_a;
        input_node_a.classList.toggle("active");
        input_wire_a.classList.toggle("active");

        update_circuit();
      });

      input_node_b.addEventListener("click", () => {
        input_b = !input_b;
        input_node_b.classList.toggle("active");
        input_wire_b.classList.toggle("active");

        update_circuit();
      });

      output_node_sum = document.getElementById("output-node-sum");
      output_node_carry = document.getElementById("output-node-carry");

      output_wire_sum = document.getElementById("output-wire-sum");
      output_wire_carry = document.getElementById("output-wire-carry");

      function update_circuit() {
        // XOR Gate: SUM = A ^ B
        const sum = input_a ^ input_b;

        output_node_sum.classList.toggle("active", Boolean(sum));
        output_wire_sum.classList.toggle("active", Boolean(sum));

        // AND Gate: CARRY = A & B
        const carry = input_a & input_b;

        output_node_carry.classList.toggle("active", Boolean(carry));
        output_wire_carry.classList.toggle("active", Boolean(carry));
      }
    </script>
  </body>
</html>
