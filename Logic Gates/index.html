<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Logic Gates Explorer</title>

    <!-- css -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #222;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .board {
        display: flex;
        flex-direction: column;
      }

      .input {
        display: flex;
        width: 100%;
        border: 2px solid white;
        border-bottom: 0;
        padding: 12px;
        font-size: 24px;
      }

      .input .one,
      .input .two {
        width: 100%;
        display: flex;
        gap: 8px;
        flex-direction: column;
      }

      .input label {
        font-size: 20px;
      }

      .input .bits {
        display: flex;
        gap: 16px;
      }

      .output {
        display: grid;
        grid-template-columns: repeat(2, 300px);
      }

      .gate {
        display: flex;
        gap: 32px;
        align-items: center;
        justify-content: space-around;
        padding: 24px;
        border: 2px solid white;
      }

      .gate img {
        width: 64px;
      }

      .gate span {
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Interactive Logic Gates Explorer</h1>
      <br />

      <div class="board">
        <div class="input">
          <div class="one">
            <span>Input A:</span>
            <div class="bits">
              <label for="A-bit-0">
                <input
                  type="radio"
                  id="A-bit-0"
                  name="input-bit-A"
                  value="0"
                  checked
                />
                0 (OFF)
              </label>

              <label for="A-bit-1">
                <input type="radio" id="A-bit-1" name="input-bit-A" value="1" />
                1 (ON)
              </label>
            </div>
          </div>

          <div class="two">
            <span>Input B:</span>
            <div class="bits">
              <label for="B-bit-0">
                <input
                  type="radio"
                  id="B-bit-0"
                  name="input-bit-B"
                  value="0"
                  checked
                />
                0 (OFF)
              </label>

              <label for="B-bit-1">
                <input type="radio" id="B-bit-1" name="input-bit-B" value="1" />
                1 (ON)
              </label>
            </div>
          </div>
        </div>

        <div class="output">
          <div class="gate">
            <div class="info">
              <h2>AND</h2>
              <span>A = 1, B = 1</span>
            </div>
            <img id="and-gate-bulb" src="./assets/bulb_off.svg" alt="" />
          </div>

          <div class="gate">
            <div class="info">
              <h2>OR</h2>
              <span>A = 1, B = 1</span>
            </div>
            <img id="or-gate-bulb" src="./assets/bulb_off.svg" alt="" />
          </div>

          <div class="gate">
            <div class="info">
              <h2>NOT A</h2>
              <span>A = 1</span>
            </div>
            <img id="not-a-gate-bulb" src="./assets/bulb_off.svg" alt="" />
          </div>

          <div class="gate">
            <div class="info">
              <h2>NOT B</h2>
              <span>A = 1</span>
            </div>
            <img id="not-b-gate-bulb" src="./assets/bulb_off.svg" alt="" />
          </div>

          <div class="gate">
            <div class="info">
              <h2>NAND</h2>
              <span>A = 1, B = 1</span>
            </div>
            <img id="nand-gate-bulb" src="./assets/bulb_off.svg" alt="" />
          </div>

          <div class="gate">
            <div class="info">
              <h2>NOR</h2>
              <span>A = 1, B = 1</span>
            </div>
            <img id="nor-gate-bulb" src="./assets/bulb_off.svg" alt="" />
          </div>

          <div class="gate">
            <div class="info">
              <h2>XOR</h2>
              <span>A = 1, B = 1</span>
            </div>
            <img id="xor-gate-bulb" src="./assets/bulb_off.svg" alt="" />
          </div>

          <div class="gate">
            <div class="info">
              <h2>XNOR</h2>
              <span>A = 1, B = 1</span>
            </div>
            <img id="xnor-gate-bulb" src="./assets/bulb_off.svg" alt="" />
          </div>
        </div>
      </div>
    </main>

    <!-- javascript -->

    <script>
      const bulbOnPath = "./assets/bulb_on.svg";
      const bulbOffPath = "./assets/bulb_off.svg";

      function updateBulb(gate, turnOn) {
        bulb = document.getElementById(`${gate}-gate-bulb`);
        bulb.src = turnOn ? bulbOnPath : bulbOffPath;
      }

      function updateGates() {
        // TODO: update info of each gate -> ex: A = 0, B = 1

        // turn on/off bulbs accordingly

        // AND gate
        updateBulb("and", input_bit_A && input_bit_B);

        // OR gate
        updateBulb("or", input_bit_A || input_bit_B);

        // NOT-A gate
        updateBulb("not-a", !input_bit_A);

        // NOT-B gate
        updateBulb("not-b", !input_bit_B);

        // NAND gate
        updateBulb("nand", !(input_bit_A && input_bit_B));

        // NOR gate
        updateBulb("nor", !(input_bit_A || input_bit_B));

        // XOR gate
        updateBulb("xor", input_bit_A ^ input_bit_B);

        // XNOR gate
        updateBulb("xnor", !(input_bit_A ^ input_bit_B));
      }

      // A-bit input
      input_bit_A_radios = document.querySelectorAll(
        "input[name='input-bit-A']",
      );

      input_bit_A = 0;

      input_bit_A_radios.forEach((radio) => {
        radio.addEventListener("change", (event) => {
          input_bit_A = +event.target.value;
          updateGates();
        });
      });

      // B-bit input
      input_bit_B_radios = document.querySelectorAll(
        "input[name='input-bit-B']",
      );

      input_bit_B = 0;

      input_bit_B_radios.forEach((radio) => {
        radio.addEventListener("change", (event) => {
          input_bit_B = +event.target.value;
          updateGates();
        });
      });

      updateGates();
    </script>
  </body>
</html>
